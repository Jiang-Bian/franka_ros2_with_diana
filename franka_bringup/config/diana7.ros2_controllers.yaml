/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98
      overruns:
        manage: false
        print_warnings: false

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces: robot_state

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      # Publish rate in Hz for convenience topics (current_pose, joint_states, wrenches, etc.).
      # Full robot state always publishes at the controller update rate (1kHz).
      convenience_publish_rate: 1000

/**:
  joint_trajectory_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - joint7

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      state_publish_rate: 100.0
      action_monitor_rate: 20.0

      allow_partial_joints_goal: false

      constraints:
        stopped_velocity_tolerance: 0.02
        goal_time: 0.0
