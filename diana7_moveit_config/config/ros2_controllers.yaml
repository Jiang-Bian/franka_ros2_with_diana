# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    diana7_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diana7_arm_controller:
  ros__parameters:
    joints:
      - diana7_joint1
      - diana7_joint2
      - diana7_joint3
      - diana7_joint4
      - diana7_joint5
      - diana7_joint6
      - diana7_joint7
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    allow_nonzero_velocity_at_trajectory_end: true